name: nexoflux

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexoflux
      POSTGRES_PASSWORD: nexoflux
      POSTGRES_USER: nexoflux
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoflux -d nexoflux"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - nexoflux_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - nexoflux_redis:/data

volumes:
  nexoflux_postgres:
  nexoflux_redis:
